<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Atlas</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<style>
@font-face{font-family:NanumGothic;src:url('fonts/NanumGothic-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:NanumGothic;src:url('fonts/NanumGothic-Bold.ttf') format('truetype');font-weight:600 900;font-display:swap}
html,body,#map{height:100%;margin:0;background:#f1f3fb;font-family:NanumGothic,sans-serif}
.leaflet-container,.leaflet-tooltip,.leaflet-control{font-family:NanumGothic,sans-serif}
html,body{border-radius:12px;overflow:hidden}
#notice{position:absolute;z-index:1000;top:18px;left:65px;right:20px;pointer-events:none}
.chip{display:inline-block;background:#f9f9fff5;padding:10px 16px;border-radius:16px;box-shadow:0 2px 6px #1a1b251a;font-size:12px;color:#454754}
#error{display:none;background:#ffdad6;color:#93000a;margin-top:8px;pointer-events:auto}
.leaflet-tooltip{border:1px solid #e1e4ee;border-radius:12px;font-size:12px;padding:8px 12px;box-shadow:0 2px 8px #1a1b251f;width:max-content;color:#18266c;background:#f9f9ff}
.leaflet-bar{border:0!important;border-radius:16px!important;overflow:hidden;box-shadow:0 2px 8px #1a1b2526!important}
.leaflet-bar a{background:#f9f9ff;color:#4355b9;width:38px;height:38px;line-height:38px;border-color:#e1e4ee}
.leaflet-bar a:hover{background:#dfe3ff;color:#18266c;width:38px;height:38px;line-height:38px}
.leaflet-control-attribution{background:#f9f9fff2!important;border-radius:8px 0 0 0;padding:3px 8px!important;color:#454754}
.leaflet-control-attribution a{color:#4355b9}
.popup{white-space:pre;line-height:1.7;font-size:13px}
</style></head><body><div id="map"></div>
<div id="notice"><div class="chip" id="caption">지도를 준비하고 있습니다…</div><br><div class="chip" id="error"></div></div>
<script>
let map=null, layers=[], data=null, selected='', tileErrors=0;
window.mapTiming={};
const colors=['#4355b9','#a86213','#7753a6','#24705a','#a64165','#52647c'];
function message(text){let el=document.getElementById('error');el.textContent=text;el.style.display=text?'inline-block':'none'}
window.configure=function(){
 message('');
 if(map)map.remove();map=null;layers=[];document.getElementById('map').replaceChildren();
 document.getElementById('caption').textContent='지도 연결 중…';
 try{
  map=L.map('map',{worldCopyJump:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,updateWhenIdle:true,keepBuffer:1,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'})
   .on('loading',()=>document.getElementById('caption').textContent='배경 지도 불러오는 중…')
   .on('tileload',()=>{window.mapTiming.firstTileMs??=Math.round(performance.now())})
   .on('load',()=>document.getElementById('caption').textContent='OpenStreetMap · 출발점 → 접속 도시')
   .on('tileerror',()=>{if(++tileErrors>=3)message('지도 타일을 불러오지 못했습니다. 인터넷 연결을 확인하세요. 측정 결과는 표에서 확인할 수 있습니다.')}).addTo(map);
  window.mapTiming.readyMs=Math.round(performance.now());
  draw(true);
 }catch(e){message('지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');}
};
window.updateData=function(value){data=value;draw(!map?false:!map._loaded)};
window.selectSite=function(site){selected=site;draw(false)};
window.fitRoutes=function(){draw(true)};
function label(text){const el=document.createElement('div');el.className='popup';el.textContent=text;return el}
// Sample a great-circle arc; unwrap longitude to keep Pacific routes continuous.
function arc(a,b){
 const rad=Math.PI/180, u=([lat,lon])=>[Math.cos(lat*rad)*Math.cos(lon*rad),Math.cos(lat*rad)*Math.sin(lon*rad),Math.sin(lat*rad)];
 let p=u(a),q=u(b),angle=Math.acos(Math.max(-1,Math.min(1,p.reduce((s,v,i)=>s+v*q[i],0))));
 if(angle<1e-6||Math.abs(Math.sin(angle))<1e-6)return [a,b];
 let out=[],prev=a[1];
 for(let i=0;i<=64;i++){let t=i/64,x=p.map((v,j)=>(Math.sin((1-t)*angle)*v+Math.sin(t*angle)*q[j])/Math.sin(angle));let lat=Math.atan2(x[2],Math.hypot(x[0],x[1]))/rad,lon=Math.atan2(x[1],x[0])/rad;while(lon-prev>180)lon-=360;while(lon-prev< -180)lon+=360;out.push([lat,lon]);prev=lon}return out;
}
function draw(fit){
 if(!map||!data)return;
 for(const layer of layers)map.removeLayer(layer);layers=[];
 const origin=[data.origin.lat,data.origin.lon],points=[origin],groups={};
 for(const r of data.results){if(r.location&&!r.error)(groups[r.colo]??=[]).push(r)}
 const marker=(point,title,color,short)=>{
  const m=L.circleMarker(point,{radius:7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(map).bindTooltip(label(title));layers.push(m);
  const tag=L.marker(point,{interactive:false,icon:L.divIcon({className:'',html:'',iconSize:[0,0]})}).addTo(map).bindTooltip(label(short),{permanent:true,direction:color==='#152b40'?'right':'left',offset:[color==='#152b40'?10:-10,0]});layers.push(tag);
 };
 marker(origin,data.origin.name+' (설정한 출발점)','#152b40',data.origin.name);
 Object.keys(groups).sort().forEach((code,index)=>{
  const rows=groups[code],loc=rows[0].location,path=arc(origin,[loc.lat,loc.lon]),end=path[path.length-1];points.push(...path);
  const active=!selected||rows.some(r=>r.site===selected),color=colors[index%colors.length];
  const title=code+' · '+loc.city+'\n'+rows.map(r=>r.site+' · '+r.elapsed_ms+' ms').join('\n');
  const line=L.polyline(path,{color,weight:active?3:1.5,opacity:active?0.85:0.2}).addTo(map).bindTooltip(label(title));layers.push(line);
  marker(end,title,color,code+' · '+rows.length+'개 사이트');
 });
 if(fit)map.fitBounds(points,{padding:[50,50],maxZoom:7,animate:false});
}
</script></body></html>
